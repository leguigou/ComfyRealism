name: Build and Publish Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]

env:
  # Force GitHub Actions to use Node.js 24 to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # We force lowercase for the repository name to comply with Docker tag standards
          tags: ghcr.io/${{ github.repository_owner }}/comfyrealism-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # We force lowercase for the repository name to comply with Docker tag standards
          tags: ghcr.io/${{ github.repository_owner }}/comfyrealism-frontend:latest
