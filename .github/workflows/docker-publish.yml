name: Build and Publish Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

env:
  # Force GitHub Actions to use Node.js 24 to avoid deprecation warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Check backend
        working-directory: ./backend
        run: |
          npm ci
          npm test
          npm run build

      - name: Check frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  build-and-push:
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          # We force lowercase for the repository owner to comply with Docker standards
          tags: |
            ghcr.io/${{ github.repository_owner }}/comfyrealism-backend:latest
            ghcr.io/${{ github.repository_owner }}/comfyrealism-backend:${{ github.ref_name }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          # We force lowercase for the repository owner to comply with Docker standards
          tags: |
            ghcr.io/${{ github.repository_owner }}/comfyrealism-frontend:latest
            ghcr.io/${{ github.repository_owner }}/comfyrealism-frontend:${{ github.ref_name }}
